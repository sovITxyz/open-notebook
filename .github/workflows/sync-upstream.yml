name: Sync from upstream

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Push upstream main to upstream-sync branch
        id: push
        run: |
          git remote add upstream https://github.com/lfnovo/open-notebook.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "::notice::Upstream has no new commits — nothing to sync."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          git push origin upstream/main:refs/heads/upstream-sync --force

      - name: Open or update PR
        if: steps.push.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          existing=$(gh pr list --head upstream-sync --base main --state open --json number -q '.[0].number' || true)
          if [ -z "$existing" ]; then
            gh pr create --base main --head upstream-sync \
              --title "Sync from upstream (lfnovo/open-notebook)" \
              --body "Automated daily sync. Review the diff and merge when ready."
          else
            echo "PR #$existing already open; force-push refreshed it."
          fi
